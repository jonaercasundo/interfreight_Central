# Isolated developer infrastructure only. Never point this profile at a populated database.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ifc_dev
      MYSQL_USER: ifc_dev
      MYSQL_PASSWORD: ifc_dev_only_change_me
      MYSQL_ROOT_PASSWORD: ifc_root_dev_only_change_me
    ports:
      - "127.0.0.1:${IFC_MYSQL_PORT:-3307}:3306"
    volumes:
      - ifc_mysql_dev:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uifc_dev", "-pifc_dev_only_change_me"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${IFC_REDIS_PORT:-6380}:6379"
    volumes:
      - ifc_redis_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  clamav:
    image: clamav/clamav:stable
    profiles: [security]
    environment:
      CLAMAV_NO_MILTERD: "true"
      FRESHCLAM_CHECKS: "24"
    volumes:
      - ifc_clamav_signatures:/var/lib/clamav
    # Keep clamd private to the Docker network; it has no host-published port.
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 6m
      retries: 3
volumes:
  ifc_mysql_dev:
  ifc_redis_dev:
  ifc_clamav_signatures:
