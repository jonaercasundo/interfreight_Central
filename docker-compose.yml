services:
  app:
    build:
      context: .
      dockerfile: docker/php.Dockerfile
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
    environment:
      AI_SERVICE_URL: http://ai:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Set AI_SERVICE_TOKEN in the root .env file}
      AI_LARAVEL_CREDENTIAL_URL: http://app:8000/api/internal/ai-credential
    command: sh -c "composer install && php artisan migrate --force && php artisan serve --host=0.0.0.0"
    depends_on:
      - ai
  vite:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
  ai:
    image: python:3.13-slim
    working_dir: /app
    volumes:
      - ./python-ai:/app
    ports:
      - "8001:8000"
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      APP_ENV: local
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Set AI_SERVICE_TOKEN in the root .env file}
      AI_LARAVEL_CREDENTIAL_URL: http://app:8000/api/internal/ai-credential
